derivs_v1:
  enabled: true
  symbols:
    - "LINK/USDT:USDT"
    - "UNI/USDT:USDT"
    - "BNB/USDT:USDT"
    - "XRP/USDT:USDT"
    - "DOGE/USDT:USDT"
    - "ADA/USDT:USDT"
    - "AVAX/USDT:USDT"
    - "TRX/USDT:USDT"
    - "LTC/USDT:USDT"
    - "DOT/USDT:USDT"
    - "ARB/USDT:USDT"
    - "APT/USDT:USDT"
    - "AAVE/USDT:USDT"
    - "SOL/USDT:USDT"
  exchangesPerp: ["binanceusdm","bybit","okx","bitget"]
  spotIndexExchanges: ["binance","kraken","coinbase"]
  timings:
    sample_interval: "1h"
    oi_z_window_hours: 168
    basis_z_window_hours: 336
    funding_window_intervals: 21
    min_history_hours: 24
  smoothing_alpha: 0.11
  timeouts_ms:
    rest: 4000
    ws: 5000
  cache:
    redis_addr: "redis:6379"
    redis_password: ""
    redis_db: 0
    keyspace: "derivs:v1"
