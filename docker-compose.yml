services:
  selfhosted-ai500:
    build:
      context: .
      dockerfile: ./services/selfhosted-ai500/Dockerfile
    container_name: selfhosted-ai500
    restart: unless-stopped
    ports:
      - "${SELFHOSTED_AI500_PORT:-8081}:8081"
    volumes:
      - ./data/selfhosted-ai500:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SELFHOSTED_AI500_PORT=8081
      - SELFHOSTED_AI500_AUTH_TOKEN=${SELFHOSTED_AI500_AUTH_TOKEN:-local-selfhosted-ai500-token}
      - SELFHOSTED_AI500_DB_PATH=/app/data/selfhosted-ai500.db
      - SELFHOSTED_AI500_EXCHANGES=${SELFHOSTED_AI500_EXCHANGES:-hyperliquid,binance,bybit}
      - SELFHOSTED_AI500_REFRESH_SECS=${SELFHOSTED_AI500_REFRESH_SECS:-60}
      - SELFHOSTED_AI500_UNIVERSE_LIMIT=${SELFHOSTED_AI500_UNIVERSE_LIMIT:-120}
      - SELFHOSTED_AI500_SCORE_THRESHOLD=${SELFHOSTED_AI500_SCORE_THRESHOLD:-70}
      - SELFHOSTED_AI500_BOOTSTRAP_CONCURRENCY=${SELFHOSTED_AI500_BOOTSTRAP_CONCURRENCY:-8}
      - SELFHOSTED_AI500_SNAPSHOT_RETENTION_HOURS=${SELFHOSTED_AI500_SNAPSHOT_RETENTION_HOURS:-72}
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Backend service (API and core logic)
  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s  # Allow the app 30 seconds for graceful shutdown
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
      - "6060:6060"  # pprof profiling
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      - EMBEDDED_REDIS_ENABLED=${EMBEDDED_REDIS_ENABLED:-true}
      - EMBEDDED_REDIS_PORT=${EMBEDDED_REDIS_PORT:-6379}
      - DERIVS_STRICT_SYMBOLS=${DERIVS_STRICT_SYMBOLS:-false}
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend service (static serving and proxy)
  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    driver: bridge
